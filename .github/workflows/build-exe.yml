name: Build Windows EXE
env:
  PYTHONUTF8: '1'
on:
  push:
    branches: [main]
    paths:
      - 'collector*.py'
      - 'seller_sprite_auto_login.py'
      - 'github_upload.py'
      - 'shared_login.py'
      - 'app_paths.py'
      - 'config_v2.json'
      - 'tasks_v2.json'
      - '*login*.ps1'
      - 'save_github_token.ps1'
      - 'tools/build_exe.py'
      - 'tools/build_installer.py'
      - 'installer/**'
      - 'requirements*.txt'
      - 'README_WINDOWS_GUI.txt'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_exe.py
      - name: Install NSIS for the build machine
        run: choco install nsis --yes --no-progress
      - run: python tools/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: SellerSpriteCollector-v2-Windows
          path: |
            dist/SellerSpriteCollector-v2-Setup.exe
            dist/SellerSpriteCollector-v2.zip
